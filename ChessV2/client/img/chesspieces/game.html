<!doctype html>
<html>

<head>
  <title>AI Chess Coach</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chessboard CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      text-align: center;
      margin: 0;
      padding: 0;
      color: white;
    }

    h1 {
      margin-top: 20px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    h2 {
      margin-top: 20px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    /* NAVBAR */
    .navbar {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(20, 20, 30, 0.6);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);

      position: sticky;
      top: 0;
      z-index: 999;
    }

    /* LEFT */
    .nav-left {
      flex: 0 0 auto;
    }

    /* CENTER (🔥 absolute center fix) */
    .nav-center {
      flex: 1;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 10px;
    }

    /* RIGHT */
    .nav-right {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* back button */
    .nav-link {
      color: white;
      font-size: 20px;
      text-decoration: none;
      opacity: 0.8;
      transition: 0.2s;
    }

    .nav-link:hover {
      opacity: 1;
      transform: translateX(-2px);
    }

    /* theme button */
    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: white;
      font-size: 16px;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .theme-btn:hover {
      transform: scale(1.1);
    }

    #theme-name {
      font-size: 11px;
      white-space: nowrap;
      color: rgba(255, 255, 255, 0.85);
    }

    /* Board container */
    #board {
      width: 600px;
      margin: 0;
      border-radius: 6px;
      overflow: hidden;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.6),
        inset 0 0 10px rgba(255, 255, 255, 0.1);
    }

    /* 🔥 LAYOUT */
    #game-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 30px;
      margin-top: 20px;
    }

    /* Board section */
    #board-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 🔥 GLASS COACH CARD */
    #coach-box {
      width: 260px;
      padding: 20px;
      border-radius: 16px;

      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);

      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;

      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      margin-top: 15px;
    }

    /* Text styling */
    #coach-text {
      font-size: 14px;
      line-height: 1.5;
    }

    /* LIGHT squares (modern cream) */
    .white-1e1d7 {
      background: #cfd8dc !important;
    }

    /* DARK squares (matte dark blue/grey) */
    .black-3c85d {
      background: #37474f !important;
    }

    /* DEFAULT THEME */
    .theme-default .white-1e1d7 {
      background: #eaeaea !important;
    }

    .theme-default .black-3c85d {
      background: #3a3f4b !important;
    }

    /* GREEN CLASSIC */
    .theme-green .white-1e1d7 {
      background: #f0d9b5 !important;
    }

    .theme-green .black-3c85d {
      background: #769656 !important;
    }

    /* DARK MODE */
    .theme-dark .white-1e1d7 {
      background: #999 !important;
    }

    .theme-dark .black-3c85d {
      background: #222 !important;
    }

    /* BLUE PREMIUM */
    .theme-blue .white-1e1d7 {
      background: #dee3e6 !important;
    }

    .theme-blue .black-3c85d {
      background: #4a6fa5 !important;
    }

    /* 💎 GLASS THEME */
    .theme-glass .white-1e1d7 {
      background: rgba(255, 255, 255, 0.6) !important;
      backdrop-filter: blur(5px);
    }

    .theme-glass .black-3c85d {
      background: rgba(60, 60, 60, 0.6) !important;
      backdrop-filter: blur(5px);
    }

    /* 🔥 SUNSET THEME */
    .theme-sunset .white-1e1d7 {
      background: #ffd6a5 !important;
    }

    .theme-sunset .black-3c85d {
      background: #b56576 !important;
    }

    /* 🌊 OCEAN THEME */
    .theme-ocean .white-1e1d7 {
      background: #dff6ff !important;
    }

    .theme-ocean .black-3c85d {
      background: #256d85 !important;
    }

    /* 👑 GOLD THEME */
    .theme-gold .white-1e1d7 {
      background: #f7e7ce !important;
    }

    .theme-gold .black-3c85d {
      background: #c9a227 !important;
    }

    /* Hover effect */
    .square-55d63:hover {
      box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.3);
      cursor: pointer;
    }

    /* Selected square */
    .highlight-selected {
      box-shadow: inset 0 0 0 3px #00ff40;
    }

    /* Possible moves */
    /* Move indicator (empty square → dot) */
    .highlight-move {
      position: relative;
    }

    .highlight-move::after {
      content: "";
      transition: transform 0.15s ease;
      width: 15px;
      height: 15px;
      background: rgba(0, 255, 150, 0.8);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Capture indicator (enemy piece → ring) */
    .highlight-capture {
      box-shadow: inset 0 0 0 4px rgba(255, 80, 80, 0.8);
    }

    /* Highlight when check */
    .highlight-check {
      background: red !important;
      box-shadow: 0 0 20px red;
    }

    /* Last move highlight */
    .highlight-last {
      background-color: rgb(249, 209, 11) !important;
    }

    /* Smooth piece animation */
    .piece-417db {
      transition:
        transform 0.2s ease,
        filter 0.2s;
    }

    .piece-417db:hover {
      transform: scale(1.08);
      filter: brightness(1.2);
    }

    #status {
      margin-top: 15px;
      font-size: 18px;
      font-weight: 500;
    }

    /* COACH BOX */
    #coach-box {
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      background: #1e1e2f;
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    }

    #coach-text {
      font-size: 14px;
      line-height: 1.5;
    }

    /* Hover glow */
    .square-55d63:hover {
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.482);
    }

    /* Highlight moves */
    .highlight-white {
      background: radial-gradient(circle,
          rgba(255, 255, 0, 0.4) 20%,
          transparent 20%);
    }

    .highlight-black {
      background: radial-gradient(circle,
          rgba(255, 255, 0, 0.4) 20%,
          transparent 20%);
    }

    /* Piece animation */
    .piece-417db {
      transition: transform 0.2s ease-in-out;
    }

    .piece-417db:hover {
      transform: scale(1.1);
    }

    /* THEME BUTTON */

    .theme-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    #timer-container {
      display: flex;
      justify-content: space-between;
      width: 420px;
      margin: 10px auto;
      font-size: 18px;
      font-weight: bold;
    }

    .mode-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      font-size: 14px;
      transition: 0.2s;
    }

    .mode-btn:hover {
      transform: scale(1.1);
    }

    /* NEXT MOVE BUTTON */
    #next-move-btn {
      padding: 10px 20px;
      font-size: 16px;
      background: #00c853;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #next-move-btn:disabled {
      background: gray;
      cursor: not-allowed;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      /* center both */
      gap: 30px;
      /* space between text and button */
      margin-top: 10px;
    }

    #status {
      font-size: 18px;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <!-- NAVBAR HTML -->
  <div class="navbar">
    <div class="nav-left">
      <a href="index.html" class="nav-link">⬅</a>
    </div>

    <div class="nav-center">♟️ AI Chess Coach</div>
    <div class="nav-right">

      <!-- 🎮 MODE BUTTONS -->
      <button onclick="setMode('coach')" class="mode-btn">🧠</button>
      <button onclick="setMode('timed')" class="mode-btn">⏱</button>

      <!-- 🎨 THEME -->
      <button onclick="changeTheme()" class="theme-btn">🎨</button>
      <span id="theme-name">Default</span>

    </div>
  </div>

  <!-- 🔥 NEW CONTAINER -->
  <div id="game-container">

    <!-- LEFT SIDE -->
    <div id="board-section">

      <div id="timer-container">
        <div id="white-timer">05:00</div>
        <div id="black-timer">05:00</div>
      </div>

      <div id="board" class="theme-default"></div>

      <div class="status-row">
        <div id="status">Your move</div>
        <button id="next-move-btn" onclick="makeAIMove()">▶ ♟️Ai Move</button>
      </div>

      
    </div>
    
    <!-- 👉 RIGHT SIDE (COACH) -->
    <div id="coach-box">
      <h3>🧠 AI Coach</h3>
      <p id="coach-text">Select a piece...</p>
    </div>
    <input id="question" placeholder="Ask AI..." />
    <button onclick="askAI()">Ask</button>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="script.js"></script>


</body>

</html>
